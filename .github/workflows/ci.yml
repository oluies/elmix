name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mill-versionen pinnas via env så att både rotscriptet och viz/ använder samma.
env:
  MILL_VERSION: "1.1.6"
  FORCE_COLOR: "1"

jobs:
  build-test:
    name: Bygg + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
            out
            viz/out
          key: mill-${{ runner.os }}-${{ hashFiles('Elmix.scala', 'viz/build.mill', '.mill-version') }}
          restore-keys: mill-${{ runner.os }}-
      - name: Kompilera rotscriptet
        run: ./mill Elmix.scala:compile
      - name: PCA-självtest
        # Mill:s forkade JVM ger ibland exitkod 1 på Linux efter att testet
        # körts klart (pipe/shutdown-race), så vi grindar på testutdatan i
        # stället: kräver "gröna" och inga "FAIL"-rader.
        run: |
          ./mill Elmix.scala test 2>&1 | tee test.log || true
          grep -q "Alla självtester gröna" test.log && ! grep -qE "^  FAIL " test.log
      - name: Kompilera viz (Scala.js)
        run: cd viz && ../mill app.compile + obalans.compile + foretagspris.compile + bess.compile
      # Golvkontrollen är sista spärren mot att publicera ofullständig data,
      # så den regressionstestas i stället för att bara finnas.
      - name: Installera DuckDB CLI
        # Pinnad till samma version som org.duckdb:duckdb_jdbc i Elmix.scala
        # (2.0.0.0). Vakterna laser samma filer som drivrutinen skriver, sa CLI
        # och drivrutin maste ligga pa samma lagringsformat - darfor flyttas de
        # alltid tillsammans, aldrig en i taget.
        #
        # Assetnamnet beror pa versionen: 1.x publicerade
        # duckdb_cli-linux-amd64.zip, 2.x publicerar
        # duckdb-cli-linux-amd64.tar.gz (bindestreck, tar). Det var just den
        # namnandringen som fallde korningarna 2026-10-22 och 2026-10-23, nar
        # URL:en pekade pa releases/latest. Byter man DUCKDB_VERSION over
        # 1.x/2.x-gransen maste raderna nedan byta form med den.
        #
        # -f far curl att falla pa 404 direkt, dar felet faktiskt finns.
        env:
          DUCKDB_VERSION: v2.0.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb-cli-linux-amd64.tar.gz" -o duckdb.tar.gz
          tar -xzf duckdb.tar.gz && sudo mv duckdb /usr/local/bin/
          duckdb --version
      - name: Test av golvkontrollen
        run: ./viz/check-raw-floor.test.sh
      # Hämtningsvakten är av samma slag - sista spärren mot att bygga på
      # ofullständig rådata - och ska därför regressionstestas likadant.
      - name: Test av hämtningsvakten
        run: ./viz/fetch-year.test.sh
      # Backfillen är enda vägen tillbaka från en kall cache och utlöses bara
      # när cachen faktiskt tappats - den kan alltså inte provas skarpt utan
      # att kosta timmar. Testas därför på samma sätt som vakterna ovan.
      - name: Test av backfillen
        run: ./viz/bootstrap-backfill.test.sh

  lint:
    name: Scalafmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/setup-action@v3
        with:
          apps: scalafmt
      - name: Kontrollera formatering
        run: scalafmt --check Elmix.scala viz/app/src viz/echarts/src viz/obalans/src viz/bess/src viz/foretagspris/src

  links:
    name: Länkkontroll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 429 och 503 betyder "servern lever men kan inte just nu", inte "länken är
      # trasig". ENTSO-E:s driftstörning i september 2026 fällde bygget på en
      # fullt giltig länk till transparency.entsoe.eu - en tredjeparts avbrott
      # ska inte stoppa vår CI.
      - name: Kontrollera länkar
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2 --accept 200,429,503
            README.md docs/index.html docs/prerendered.html
          fail: true
