name: Data refresh

on:
  schedule:
    - cron: '17 5 * * *'   # 05:17 UTC dagligen
  workflow_dispatch:       # manuell körning från Actions-fliken
    inputs:
      steg:
        description: 'Vilket steg som ska köras'
        type: choice
        options: [allt, hamta, bygg]
        default: allt
      ar:
        description: 'År att hämta om (tomt = innevarande)'
        type: string
        default: ''

permissions:
  contents: write          # för att committa/pusha ombyggd docs/

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Installera DuckDB CLI
        run: |
          curl -sL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o duckdb.zip
          unzip -q duckdb.zip && sudo mv duckdb /usr/local/bin/ && duckdb --version

      - name: npm (SSR-prerendering)
        run: cd viz/ssr && npm install

      # Persistera rådata + elmix.duckdb mellan körningar så bara innevarande år
      # behöver hämtas om. run_id i nyckeln => varje körning sparar ny cache;
      # restore-keys återställer den senaste.
      - name: Restore rådata-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            data/raw
            elmix.duckdb
          key: elmix-rawdata-v1-${{ github.run_id }}
          restore-keys: elmix-rawdata-v1-

      # Fyller på historiken när cachen tappats, ett år i taget inom en
      # tidsbudget. Ligger FÖRE hämtningen av innevarande år med flit: bygget
      # ska ha flera år att stå på, inte bara de timmar som hunnit hämtas i
      # dag. Budget 150 min + dygnets ~50 min ryms med marginal under GitHubs
      # 6-timmarstak; det som inte hinns med tas av nästa körning. Se
      # viz/bootstrap-backfill.sh för varför den inte längre görs i ett svep.
      # continue-on-error: skriptet exitar redan alltid 0, men det löftet gäller
      # bara så länge det kommer till sitt slut. Backfillen får inte hindra att
      # dagens data publiceras ens om skalet självt dör - historik är det enda
      # som står på spel här, och den tas av nästa körning.
      - name: Backfill av historiken (tidsbudgeterad)
        if: inputs.steg != 'bygg'
        continue-on-error: true
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: ./viz/bootstrap-backfill.sh

      # Faller på ENTSO-E:s uppetid (503/400 -> tyst tappade dataset). Rör bara
      # data/raw, så ett fel här lämnar marts och docs/ orörda och det räcker att
      # köra om det här steget - välj steg=hamta vid manuell omkörning.
      - name: Hämta ENTSO-E-data
        if: inputs.steg != 'bygg'
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          AR: ${{ inputs.ar }}
        run: |
          ./viz/kontrollera-ar.sh "$AR"
          ./viz/fetch-year.sh "$AR"

      # Faller på DuckDB, inte på ENTSO-E, och behöver ingen API-nyckel. Kör om
      # med steg=bygg när hämtningen redan gav färsk rådata - golvkontrollen
      # först i skriptet ser till att steget aldrig publicerar på halvfärdig data.
      - name: Bygg marts + rapporter
        if: inputs.steg != 'hamta'
        env:
          AR: ${{ inputs.ar }}
        run: |
          ./viz/kontrollera-ar.sh "$AR"
          ./viz/build-reports.sh "$AR"

      # Committa docs. Jobbet tar ~1h, så main kan hinna flyttas (PR-merge) under
      # tiden -> push avvisas eller krockar. Vid avslag: synka till senaste main och
      # BYGG OM docs mot den (rådatan är redan hämtad, så ombygget är snabbt och
      # deterministiskt) -> aldrig innehållskonflikt, alltid ovanpå senaste källa.
      - name: Committa ombyggd docs (rebasa + bygg om vid krock)
        if: inputs.steg != 'hamta'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add docs   # add före diff-koll: annars missas NYA (untracked) filer
            if git diff --cached --quiet -- docs; then
              echo "Inga ändringar i docs/ – hoppar commit."; exit 0
            fi
            git commit -m "data refresh $(date -u +%Y-%m-%d) [skip ci]"
            if git push; then echo "pushad"; exit 0; fi
            echo "push avvisad (main har flyttats) – synkar och bygger om (försök $attempt/3)"
            git fetch origin main
            git reset --hard origin/main
            ./viz/publish-pages.sh
          done
          echo "FEL: kunde inte pusha docs efter 3 försök"; exit 1

      # Spara även vid fel (annars tvingas full hämtning nästa körning).
      - name: Spara rådata-cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            data/raw
            elmix.duckdb
          key: elmix-rawdata-v1-${{ github.run_id }}
